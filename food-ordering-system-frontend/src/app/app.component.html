<!-- Root app shell -->
<div class="app-shell">

  <!-- ── Top Navigation ──────────────────────── -->
  <header class="nav">
    <div class="nav-inner">
      <a routerLink="/" class="nav-brand">
        <span class="brand-icon">🍽️</span>
        <span class="brand-name">JumpStart<strong>Eats</strong></span>
      </a>
      <nav class="nav-links">
        <a routerLink="/menu" routerLinkActive="active" class="nav-link">Menu</a>
        <a routerLink="/categories" routerLinkActive="active" class="nav-link">Categories</a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">Orders</a>
        <a routerLink="/about" routerLinkActive="active" class="nav-link">About</a>
      </nav>
      <a routerLink="/cart" class="nav-cart">
        🛒 <span class="cart-count">{{ cartCount() }}</span>
      </a>
    </div>
  </header>

  <!-- ── Routed Page Content ───────────────── -->
  <main>
    <router-outlet></router-outlet>
  </main>

  <!-- ── Footer ────────────────────────────── -->
  <footer class="footer">
    <p>© 2024 JumpStart Eats — com.jumpstart · food-ordering-system</p>
    <p class="footer-api">Backend: <code>http://localhost:8085/api/categories</code></p>
  </footer>

</div>
